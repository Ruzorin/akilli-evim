# intimacy_sync_mode - ESP32 + MPU6050 Ivmeölçer Yapılandırması
# Yatak iskeletine monte edilen sensör ile fiziksel ritim algılama

esphome:
  name: intimacy-sync-sensor
  platform: ESP32
  board: esp32dev

wifi:
  ssid: "GL-MT3000"
  password: "YOUR_WIFI_PASSWORD"

mqtt:
  broker: "gl-mt3000.local"
  port: 1883

i2c:
  sda: 21
  scl: 22
  scan: true

# MPU6050 ivmeölçer ve ritim algılama mantığı
