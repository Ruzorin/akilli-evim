# =============================================================================
# vision_chef_assistant — Mutfak Otomasyonları (Etkileşim Senaryoları)
# =============================================================================
# Bu dosya 3 senaryo için otomasyon tanımlar:
#
#   Senaryo 1 (Ne Pişirsek?):    Malzemeleri gör → tarif öner
#   Senaryo 2 (Tehlike/Uyarı):   Duman/yanma → proaktif uyarı
#   Senaryo 3 (Etkileşimli):     Buton çift tık → komik durum güncellemesi
#
# 🎯 ON-DEMAND ANALİZ MANTIĞI:
# =============================================================================
# Kamera SÜREKLİ analiz etmez. Sadece:
#   - Kullanıcı komut verdiğinde (On-Demand)
#   - Otomasyon tetiklediğinde (buton, NFC, sensör)
#   - Güvenlik modunda (ocak gözetimsiz) düşük FPS ile
#
# Bu, CPU + API maliyeti + bant genişliği tasarrufu sağlar.
# Sürekli analiz = gereksiz; On-Demand = verimli.
# =============================================================================

# -----------------------------------------------------------------------------
# INPUT BOOLEAN — Mutfak şef modu aktif
# -----------------------------------------------------------------------------
input_boolean:
  chef_mode_active:
    name: "Chef Mode"
    icon: mdi:chef-hat
    initial: off

# -----------------------------------------------------------------------------
# RESTFUL COMMAND — Vision Analiz İsteği
# -----------------------------------------------------------------------------
# vision_frame_analyzer.py, bir HTTP endpoint sunar (Flask/FastAPI).
# HA, bu endpoint'e POST isteği göndererek kamera analizini tetikler.
# Bu, "On-Demand" analiz için kullanılır.
rest:
  - resource: "http://localhost:5000/analyze"
    scan_interval: 0
    commands:
      # Tarif önerisi ("bunlardan ne çıkar?")
      - name: "chef_analyze_recipe"
        method: "POST"
        headers:
          Content-Type: "application/json"
        payload: '{"mode": "recipe", "message": "Bunlardan ne çıkar?"}'

      # Güvenlik analizi (duman/yanma kontrolü)
      - name: "chef_analyze_safety"
        method: "POST"
        headers:
          Content-Type: "application/json"
        payload: '{"mode": "safety", "message": "Güvenlik kontrolü"}'

      # Etkileşimli durum güncellemesi
      - name: "chef_analyze_interactive"
        method: "POST"
        headers:
          Content-Type: "application/json"
        payload: '{"mode": "interactive", "message": "Durum güncellemesi"}'

# -----------------------------------------------------------------------------
# OTOMASYONLAR
# -----------------------------------------------------------------------------
automation:
  # ===========================================================================
  # SENARYO 1: Ne Pişirsek? — Malzemeleri Gör → Tarif Öner
  # ===========================================================================
  - id: chef_recipe_suggestion
    alias: "Chef — Ne Pişirsek? (Tarif Önerisi)"
    description: >
      Kullanıcı tezgahın üzerine 3-4 farklı malzeme koyup "Jarvis, bunlardan
      ne çıkar?" dediğinde, kameradan görüntü alıp anında havalı bir tarif
      öneren otomasyon.

      🎭 MANTIK:
      Kullanıcı "Jarvis, bunlardan ne çıkar?" der → HA, vision_frame_analyzer.py'ye
      "recipe" modunda analiz isteği gönderir → Kamera kare alır → GPT-4o Vision
      malzemeleri tanır → Jarvis şef kişiliğiyle tarif önerir → TTS ile konuşur.

      On-Demand: Sadece bu komutta kamera çalışır. Sürekli analiz YOK.

    trigger:
      # -------------------------------------------------------------------------
      # Tetikleyici 1: Jarvis ses komutu
      # -------------------------------------------------------------------------
      - platform: conversation
        command: "bunlardan ne çıkar"
        id: voice_recipe_tr

      - platform: conversation
        command: "what can I cook"
        id: voice_recipe_en

      # -------------------------------------------------------------------------
      # Tetikleyici 2: Mutfak Zigbee butonu tek tıklama
      # -------------------------------------------------------------------------
      - platform: state
        entity_id: sensor.kitchen_button_action
        to: "single"
        id: kitchen_button_recipe

    condition:
      # Şef modu aktif olmalı (veya otomatik aktive et)
      - condition: template
        value_template: "{{ true }}"

    action:
      # -------------------------------------------------------------------------
      # AKSİYON 1: Şef modunu aktif et
      # -------------------------------------------------------------------------
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.chef_mode_active

      # -------------------------------------------------------------------------
      # AKSİYON 2: Vision analiz isteği gönder (recipe modu)
      # -------------------------------------------------------------------------
      # HA, vision_frame_analyzer.py'ye POST isteği gönderir.
      # Python script: kamera karesi al → GPT-4o Vision → tarif önerisi
      - service: rest_command.chef_analyze_recipe

      # Analiz tamamlanana kadar bekle (vision_frame_analyzer.py async)
      - delay:
          seconds: 5 # GPT-4o Vision ~3-5 saniye

      # -------------------------------------------------------------------------
      # AKSİYON 3: Analiz sonucunu al ve Jarvis'e TTS olarak gönder
      # -------------------------------------------------------------------------
      # vision_frame_analyzer.py, analizi MQTT'ye publish eder:
      #   jarvis/chef/analysis → {"text": "Domates, soğan, et... bir ragu yapalım."}
      # HA, bu MQTT mesajını dinler ve TTS'e gönderir.
      # (MQTT trigger aşağıda ayrı bir otomasyon olarak tanımlı)

  # ===========================================================================
  # SENARYO 1b: MQTT Analiz Sonucu → Jarvis TTS
  # ===========================================================================
  - id: chef_analysis_tts
    alias: "Chef — Analiz Sonucu → Jarvis TTS"
    description: >
      vision_frame_analyzer.py'nin MQTT'ye publish ettiği analiz sonucunu
      alır ve Jarvis'e (ElevenLabs TTS) gönderir.
    trigger:
      - platform: mqtt
        topic: "jarvis/chef/analysis"
        id: chef_analysis_result
    condition: []
    action:
      # Jarvis şef yorumunu sesli olarak söyler
      - service: tts.speak
        target:
          entity_id: tts.jarvis_voice
        data:
          message: "{{ trigger.payload_json.text }}"

  # ===========================================================================
  # SENARYO 2: Tehlike/Uyarı — Duman/Yanma → Proaktif Uyarı
  # ===========================================================================
  - id: chef_safety_warning
    alias: "Chef — Tehlike Uyarısı (Duman/Yanma)"
    description: >
      Görsel analizde ocakta duman tüttüğü veya bir şeyin yanmaya başladığı
      tespit edilirse (veya ocak uzun süre gözetimsiz kaldıysa) Jarvis'in
      proaktif olarak araya girip uyarı yaptığı otomasyon.

      🎭 MANTIK:
      Güvenlik modu aktifken (ocak açık + gözetimsiz), vision_frame_analyzer.py
      düşük FPS (0.5) ile ocağı izler. Duman/yanma tespit edilirse:
        1. MQTT'ye "jarvis/chef/warning" publish eder
        2. HA, bu uyarıyı alır ve Jarvis'e TTS gönderir
        3. Jarvis "Patron, yemeği yakıyorsunuz" der
        4. Mobil bildirim gönderir

      🚨 GÜVENLİK ÖNCELİĞİ:
      Bu otomasyon, diğer tüm modlardan ÖNCE gelir. Intimacy/film modunda
      bile çalışır — güvenlik her zaman önceliklidir.

    trigger:
      # -------------------------------------------------------------------------
      # Tetikleyici 1: vision_frame_analyzer.py'den duman/yanma uyarısı
      # -------------------------------------------------------------------------
      # MQTT topic: jarvis/chef/warning
      # Payload: {"text": "UYARI: Ocağı kısın, yemek yanıyor.", "severity": "high"}
      - platform: mqtt
        topic: "jarvis/chef/warning"
        id: chef_warning

      # -------------------------------------------------------------------------
      # Tetikleyici 2: Ocak gözetimsiz kaldı (akıllı priz + varlık sensörü)
      # -------------------------------------------------------------------------
      # Eğer ocak prizi açık (güç > 50W) VE odada 10 dk hareketsizlik varsa
      # → ocak gözetimsiz → güvenlik analizi tetikle
      - platform: template
        value_template: >
          {{ is_state('switch.stove_plug', 'on') and
             is_state('binary_sensor.room_presence', 'off') and
             (states.binary_sensor.room_presence.last_changed | default(now())).total_seconds() > 600 }}
        id: stove_unattended

    condition: []

    action:
      # -------------------------------------------------------------------------
      # AKSİYON 1: Vision güvenlik analizi tetikle
      # -------------------------------------------------------------------------
      # Eğer tetikleyici "stove_unattended" ise, önce kamera analiz et
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'stove_unattended' }}"
            sequence:
              - service: rest_command.chef_analyze_safety
              - delay:
                  seconds: 5 # Analiz bekle

      # -------------------------------------------------------------------------
      # AKSİYON 2: Jarvis sesli uyarı (KRİTİK — güvenlik)
      # -------------------------------------------------------------------------
      # 🚨 Güvenlik uyarısı: Duygu profili "authoritative" (net, güçlü)
      # Diğer tüm modlar (intimacy, film) ÇALIŞMAZ — güvenlik öncelikli
      - service: tts.speak
        target:
          entity_id: tts.jarvis_voice
        data:
          message: >
            {% if trigger.id == 'chef_warning' %}
              {{ trigger.payload_json.text }}
            {% else %}
              Patron, ocağı gözetimsiz bıraktınız. Güvenlik kontrolü yapıyorum.
            {% endif %}

      # -------------------------------------------------------------------------
      # AKSİYON 3: Mobil bildirim (acil)
      # -------------------------------------------------------------------------
      - service: notify.mobile_app
        data:
          title: "⚠️ Mutfak Uyarısı"
          message: >
            {% if trigger.id == 'chef_warning' %}
              {{ trigger.payload_json.text }}
            {% else %}
              Ocak gözetimsiz! Lütfen mutfak kontrol edin.
            {% endif %}
          data:
            push:
              interruption_level: "critical" # Acil bildirim (sessiz modu geçer)
              sound: "alarm_critical.caf"

  # ===========================================================================
  # SENARYO 3: Etkileşimli Yemek/Date Modu — Komik Durum Güncellemesi
  # ===========================================================================
  - id: chef_interactive_update
    alias: "Chef — Etkileşimli Durum Güncellemesi"
    description: >
      Masadaki gizli TTP223 sensörüne veya mutfaktaki Zigbee butonuna çift
      tıklandığında kameranın anlık durum değerlendirmesi yapıp mevcut duruma
      göre komik bir durum güncellemesi yapması.

      🎭 MANTIK:
      Çift tık → "Durum güncellemesi" → Kamera kare al → GPT-4o Vision
      tezgahı analiz et → Jarvis komik/akıllıca bir yorum yapar.

      Örnek: Tezgah dağınık → "Bu tezgah bir savaş alanı. Önce düzen, sonra lezzet."
      Örnek: Tezgah boş → "Boş bir tezgah, boş bir potansiyel. Bir şeyler yapalım."
      Örnek: Bir şey pişiyor → "Hmm, kokusu güzel. Ama görünüşü... çalışıyoruz."

    trigger:
      # -------------------------------------------------------------------------
      # Tetikleyici 1: Mutfak Zigbee butonu çift tıklama
      # -------------------------------------------------------------------------
      - platform: state
        entity_id: sensor.kitchen_button_action
        to: "double"
        id: kitchen_double_click

      # -------------------------------------------------------------------------
      # Tetikleyici 2: TTP223 kapasitif sensör çift tıklama (masa üstü)
      # -------------------------------------------------------------------------
      - platform: mqtt
        topic: "jarvis/triggers/desk_touch/gesture"
        payload: "double_click"
        id: desk_double_touch

    condition:
      # Şef modu aktif olmalı (veya otomatik aktive et)
      - condition: template
        value_template: "{{ true }}"

    action:
      # -------------------------------------------------------------------------
      # AKSİYON 1: Şef modunu aktif et
      # -------------------------------------------------------------------------
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.chef_mode_active

      # -------------------------------------------------------------------------
      # AKSİYON 2: Vision etkileşimli analiz tetikle
      # -------------------------------------------------------------------------
      # "interactive" modu → GPT-4o Vision tezgahı komik bir şekilde yorumlar
      - service: rest_command.chef_analyze_interactive

      # Analiz tamamlanana kadar bekle
      - delay:
          seconds: 5

      # -------------------------------------------------------------------------
      # AKSİYON 3: Analiz sonucu → Jarvis TTS
      # -------------------------------------------------------------------------
      # vision_frame_analyzer.py, analizi MQTT'ye publish eder:
      #   jarvis/chef/analysis → {"text": "Bu tezgah bir savaş alanı..."}
      # chef_analysis_tts otomasyonu (Senaryo 1b) bunu TTS'e gönderir.
      # Burada tekrar TTS çağırmaya gerek yok — MQTT otomasyonu yakalar.

  # ===========================================================================
  # SENARYO 3b: Güvenlik Modu — Ocak Açık → Sürekli İzleme Başlat
  # ===========================================================================
  - id: chef_safety_monitor_start
    alias: "Chef — Güvenlik Modu Başlat (Ocak Açık)"
    description: >
      Ocak prizi açıldığında (güç > 50W), vision_frame_analyzer.py'nin
      güvenlik modunu (0.5 FPS sürekli izleme) başlatır.

      🎯 MANTIK:
      Ocak açık → güvenlik modu başlar → kamera 2 saniyede 1 kare alır →
      duman/yanma kontrolü yapar. Ocak kapanınca güvenlik modu durur.

      Bu, "On-Demand" analiz ile "sürekli izleme" arasındaki dengeyi sağlar:
      - Normalde: On-Demand (sadece istek gelince)
      - Ocak açıkken: Sürekli izleme (0.5 FPS — düşük maliyet)

    trigger:
      # Ocak prizi açıldığında (güç > 50W)
      - platform: numeric_state
        entity_id: sensor.stove_power
        above: 50
        id: stove_on

    condition: []

    action:
      # vision_frame_analyzer.py'ye güvenlik modu başlat sinyali gönder
      - service: mqtt.publish
        data:
          topic: "jarvis/chef/safety_mode"
          payload: "ON"
          retain: true

  # ===========================================================================
  # SENARYO 3c: Güvenlik Modu — Ocak Kapandı → İzleme Durdur
  # ===========================================================================
  - id: chef_safety_monitor_stop
    alias: "Chef — Güvenlik Modu Durdur (Ocak Kapandı)"
    description: >
      Ocak prizi kapandığında (güç < 5W), güvenlik modunu durdurur.
      Kamera sürekli izlemeyi bırakır → CPU/API tasarrufu.
    trigger:
      - platform: numeric_state
        entity_id: sensor.stove_power
        below: 5
        for:
          minutes: 1
        id: stove_off

    condition: []

    action:
      - service: mqtt.publish
        data:
          topic: "jarvis/chef/safety_mode"
          payload: "OFF"
          retain: true

      # Şef modunu kapat
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.chef_mode_active
