# smart_diffuser - Akıllı Koku Difüzörü Otomasyonu
# Zamanlama ve sahne bazlı koku yayını

diffuser:
  entity_id: "switch.smart_diffuser"
  mist_level: 2
  led_color: "#2E86AB"

scenes:
  relax:
    scent: "lavender"
    duration_min: 30
  energize:
    scent: "citrus"
    duration_min: 15
  sleep:
    scent: "chamomile"
    duration_min: 60
