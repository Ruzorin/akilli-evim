# =============================================================================
# jarvis_core 2.0 — Autonomous Conversation Trigger (Proactive Speaking)
# =============================================================================
# Bu otomasyon, Jarvis'in her zaman komut beklemesini engeller. Jarvis,
# ortamı gözlemleyerek SOHBETİ KENDİ BAŞINA BAŞLATABİLİR (Proactive Speaking).
#
# ⚠️ NOT: Sesli proaktif konuşma minimax_realtime_orchestrator.py üzerinden
# MiniMax Speech 2.8 Turbo WebSocket ile yapılır. Bu YAML, HA otomasyon
# tetikleyicilerini ve MQTT olaylarını tanımlar.
#
# 🧠 "PROAKTİF DAVRANIŞ" MANTIĞI:
# =============================================================================
# Sıradan asistanlar (Siri/Alexa) sadece komut bekler — pasif.
# Jarvis ise ORTAMI GÖZLEMLER ve gerektiğinde KENDİ BAŞINA konuşur — proaktif.
#
# Bu, "insansı" hissiyatın zirvesidir:
#   Pasif asistan: "Komut bekliyorum" → "robot"
#   Proaktif Jarvis: "Sessizliği fark edip sohbet başlatıyor" → "kişi"
#
# 🎭 "PREMIUM" HİSSİYAT:
# =============================================================================
# Misafir bir kitaba bakıyorsa → Jarvis "İlginç bir seçim" der →
# "Oda beni izliyor ve düşünüyor" hissi → "premium".
#
# Ama asla rahatsız edici olma — sessizlik "söz hakkı" demek.
# Jarvis sadece "doğal bir an" olduğunda konuşur.
# =============================================================================

# -----------------------------------------------------------------------------
# INPUT BOOLEAN — Proaktif mod aktif/pasif
# -----------------------------------------------------------------------------
input_boolean:
  jarvis_proactive_mode:
    name: "Jarvis Proactive Mode"
    icon: mdi:robot-outline
    initial: on

# -----------------------------------------------------------------------------
# INPUT NUMBER — Sessizlik eşiği (dakika)
# -----------------------------------------------------------------------------
input_number:
  jarvis_silence_threshold:
    name: "Jarvis Silence Threshold"
    min: 5
    max: 60
    step: 5
    initial: 15
    unit_of_measurement: "dakika"
    icon: mdi:timer-silence

# -----------------------------------------------------------------------------
# SENSOR — Son ses/movement algılama zamanı
# -----------------------------------------------------------------------------
template:
  - sensor:
      - name: "Minutes Since Last Activity"
        unique_id: "minutes_since_last_activity"
        icon: mdi:clock-alert
        unit_of_measurement: "min"
        state: >
          {% if has_value('binary_sensor.room_presence') %}
            {% set last = states.binary_sensor.room_presence.last_changed %}
            {% set diff = (now() - last).total_seconds() / 60 %}
            {{ diff | round(0) }}
          {% else %}
            0
          {% endif %}

# -----------------------------------------------------------------------------
# OTOMASYONLAR
# -----------------------------------------------------------------------------
automation:
  # ===========================================================================
  # SENARYO 1: Uzun Sessizlik → Proaktif Sohbet Başlat
  # ===========================================================================
  - id: jarvis_proactive_silence_break
    alias: "Jarvis — Proaktif Sessizlik Kırma"
    description: >
      Ortamda uzun süren bir sessizlik olduğunda (varsayılan 15 dakika),
      Jarvis SOHBETİ KENDİ BAŞINA BAŞLATIR.

      🎭 MANTIK:
      Uzun sessizlik → "sıkıcı" hissi → Jarvis "doğal bir an" yakalar →
      kısa, zarif bir yorum yapar → "oda canlı" hissi → "premium".

      Ama asla rahatsız edici olma — sadece "doğal bir an" olduğunda konuşur.
      Sessizlik "söz hakkı" demek; Jarvis bu hakkı zarif kullanır.

      ÖRNEKLER:
      - "Sessizlik bazen en iyi sohbetmidir, efendim."
      - "Bir şey mi düşünüyorsunuz? Yoksa sadece anın tadını mı çıkarıyorsunuz?"
      - "Bu sakinlik hoş. Çok nadir bulunan bir lüks."

    trigger:
      - platform: template
        value_template: >
          {{ states('sensor.minutes_since_last_activity') | int >=
             states('input_number.jarvis_silence_threshold') | int }}
        id: silence_threshold

    condition:
      - condition: state
        entity_id: input_boolean.jarvis_proactive_mode
        state: "on"
      - condition: state
        entity_id: binary_sensor.room_presence
        state: "on"
      - condition: state
        entity_id: input_boolean.intimacy_sync_active
        state: "off"
      - condition: state
        entity_id: input_boolean.movie_mode_active
        state: "off"
      - condition: sun
        before: sunset
        after: sunrise
      - condition: template
        value_template: >
          {{ (now() - states.input_boolean.jarvis_proactive_mode.last_changed).total_seconds() > 1800 }}

    action:
      # MiniMax Speech 2.8 Turbo üzerinden proaktif konuşma
      # minimax_realtime_orchestrator.py MQTT "jarvis/voice/speak" dinler
      - service: mqtt.publish
        data:
          topic: "jarvis/voice/speak"
          payload: >
            {{ [
              "Sessizlik bazen en iyi sohbettir, efendim.",
              "Bir şey mi düşünüyorsunuz? Yoksa sadece anın tadını mı çıkarıyorsunuz?",
              "Bu sakinlik hoş. Çok nadir bulunan bir lüks.",
              "Bir şey gerekirse, buradayım. Ama sessizlik de güzel.",
              "Odanın bu hali... huzurlu. Daha ne istenebilir?"
            ] | random | to_json }}
          retain: false

  # ===========================================================================
  # SENARYO 2: Kamera — İlginç Hareket → Proaktif Yorum
  # ===========================================================================
  - id: jarvis_proactive_camera_observation
    alias: "Jarvis — Proaktif Kamera Gözlemi"
    description: >
      Kamerada ilginç bir hareket algılandığında (misafir bir kitaba bakıyorsa,
      bir tabloyu inceliyorsa, veya bir şaşkınlık ifadesi varsa), Jarvis
      SOHBETİ KENDİ BAŞINA BAŞLATIR.

      🎭 MANTIK:
      Misafir bir kitaba bakıyorsa → "Oda beni izliyor" hissi →
      Jarvis "İlginç bir seçim" der → "premium".

      Bu, "proaktif gözlem" yeteneğidir — Jarvis sadece komut beklemez,
      ORTAMI OKUR ve DOĞAL ANLAR yakalar.

      GÜVENLİK:
      Kamera görüntüsü LOKAL işlenir (facial_memory_and_vector_db.py).
      Görüntü buluta gönderilmez. Sadece "hareket tipi" bilgisi HA'a gelir.

    trigger:
      # facial_memory_and_vector_db.py, kamera görüntüsünde "ilginç" hareket
      # algıladığında MQTT'ye "jarvis/camera/observation" publish eder.
      - platform: mqtt
        topic: "jarvis/camera/observation"
        id: camera_observation

    condition:
      - condition: state
        entity_id: input_boolean.jarvis_proactive_mode
        state: "on"
      - condition: state
        entity_id: binary_sensor.room_presence
        state: "on"
      - condition: state
        entity_id: input_boolean.intimacy_sync_active
        state: "off"

    action:
      - variables:
          observation_type: "{{ trigger.payload_json.type | default('unknown') }}"

      - choose:
          # Kitaba bakıyor → Kitap yorumu
          - conditions:
              - condition: template
                value_template: "{{ observation_type == 'looking_at_book' }}"
            sequence:
              - service: mqtt.publish
                data:
                  topic: "jarvis/voice/speak"
                  payload: >
                    {{ [
                      "İlginç bir seçim. O yazarın diğer eserlerini de tavsiye ederim.",
                      "Güzel bir kitap. Umarım sayfalar sizi sürükler.",
                      "Okuma bir yolculuktur. Nereye gideceğinizi asla bilemezsiniz."
                    ] | random | to_json }}
                  retain: false

          # Tabloyu/resmi inceliyor → Sanat yorumu
          - conditions:
              - condition: template
                value_template: "{{ observation_type == 'looking_at_art' }}"
            sequence:
              - service: mqtt.publish
                data:
                  topic: "jarvis/voice/speak"
                  payload: >
                    {{ [
                      "Sanat, göründüğünden daha fazlasını söyler. Ne görüyorsunuz?",
                      "Her tabloda bir hikaye gizlidir. Bazen izleyici de hikayenin parçasıdır.",
                      "Güzel, değil mi? Sanatın gücü, sessizliğinde yatar."
                    ] | random | to_json }}
                  retain: false

          # Şaşkınlık ifadesi → Merak yorumu
          - conditions:
              - condition: template
                value_template: "{{ observation_type == 'surprised' }}"
            sequence:
              - service: mqtt.publish
                data:
                  topic: "jarvis/voice/speak"
                  payload: >
                    {{ [
                      "Bir şey mi dikkat çekti? Merak, zekanın en güzel halidir.",
                      "Şaşkınlık, keşfin başlangıcıdır. Ne buldunuz?",
                      "O ifade... umarım iyi bir sürprizdir."
                    ] | random | to_json }}
                  retain: false

          # Telefonla oynuyor → Hafif alaycı yorum
          - conditions:
              - condition: template
                value_template: "{{ observation_type == 'looking_at_phone' }}"
            sequence:
              - service: mqtt.publish
                data:
                  topic: "jarvis/voice/speak"
                  payload: >
                    {{ [
                      "Telefon mu, yoksa oda mı daha ilginç? Cevabı biliyorum.",
                      "Ekranlar bazen en güzel anları kaçırırlar. Ama kimim ki yargılayan.",
                      "O küçük kutuda her şey var... ama bu odada da bir şeyler var."
                    ] | random | to_json }}
                  retain: false

        # Bilinmeyen hareket → Genel zarif yorum
        default:
          - service: mqtt.publish
            data:
              topic: "jarvis/voice/speak"
              payload: '"Bir şey mi dikkat çekti, efendim?"'
              retain: false

  # ===========================================================================
  # SENARYO 3: Misafir Girişi → Proaktif Karşılama (Yüz Tanıma ile)
  # ===========================================================================
  - id: jarvis_proactive_guest_welcome
    alias: "Jarvis — Proaktif Misafir Karşılama (Yüz Tanıma)"
    description: >
      Kamera, bilinen bir yüz algıladığında (facial_memory_and_vector_db.py),
      Jarvis proaktif olarak misafiri İSMİYLE karşıl ve geçmiş sohbeti hatırla.

      🎭 MANTIK:
      Misafir odaya girer → kamera yüzü tanır → Jarvis "Ah, Ayşe!" der →
      "hatırlandığını" hisseder → "5 yıldızlı otel" deneyimi.

    trigger:
      # MQTT topic: jarvis/face/detected
      # Payload: {"type": "known_face", "name": "Ayşe", "last_visit": "2026-07-15",
      #           "conversation_summary": "Interstellar konuştuk, latte içti",
      #           "favorite_coffee": "Latte"}
      - platform: mqtt
        topic: "jarvis/face/detected"
        id: known_face

    condition:
      - condition: state
        entity_id: input_boolean.jarvis_proactive_mode
        state: "on"

    action:
      - variables:
          guest_name: "{{ trigger.payload_json.name | default('Misafir') }}"
          last_visit: "{{ trigger.payload_json.last_visit | default('') }}"
          conversation_summary: "{{ trigger.payload_json.conversation_summary | default('') }}"
          favorite_coffee: "{{ trigger.payload_json.favorite_coffee | default('') }}"

      # 🎭 Duygu profili: "charming" (sıcak, davetkar)
      # minimax_realtime_orchestrator.py MQTT "jarvis/voice/emotion" dinler
      - service: mqtt.publish
        data:
          topic: "jarvis/voice/emotion"
          payload: "charming"
          retain: false

      # Jarvis karşılama konuşması (MiniMax Speech 2.8 Turbo)
      - service: mqtt.publish
        data:
          topic: "jarvis/voice/speak"
          payload: >
            {% if favorite_coffee and conversation_summary %}
              {{ ("Tekrar hoş geldiniz, " ~ guest_name ~ ". Son ziyaretinizde " ~ favorite_coffee ~ " içmiştiniz ve " ~ conversation_summary ~ ". Yine " ~ favorite_coffee ~ " mi, yoksa bugün farklı bir macera mı?") | to_json }}
            {% elif favorite_coffee %}
              {{ ("Tekrar hoş geldiniz, " ~ guest_name ~ ". Yine " ~ favorite_coffee ~ " ister misiniz?") | to_json }}
            {% else %}
              {{ ("Tekrar hoş geldiniz, " ~ guest_name ~ ". Sizi görmek güzel.") | to_json }}
            {% endif %}
          retain: false

      # Opsiyonel: Misafir için otomatik hospitality
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ favorite_coffee | length > 0 }}"
            sequence:
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.barista_mode_active
              - service: switch.turn_on
                target:
                  entity_id: switch.coffee_machine_plug
