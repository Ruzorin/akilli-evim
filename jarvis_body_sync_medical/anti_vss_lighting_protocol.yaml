# =============================================================================
# jarvis_body_sync_medical — Anti-VSS Lighting Protocol (Nöro-Optik)
# =============================================================================
# Visual Snow Syndrome (VSS) için nörolojik olarak optimize edilmiş
# aydınlatma protokolü. Ani ışık değişimleri, flaş/strobe efektleri ve
# sert mavi ışık KESİNLİKLE engellenir.
#
# 🧠 VSS NÖRO-OPTİK MANTIĞI:
# =============================================================================
# VSS hastalarında görsel korteks aşırı duyarlıdır. Ani ışık değişimleri
# statik karıncalanmayı artırır, fotofobi tetikler ve palinopsia (görüntü
# kalıntıları) yaratır. Bu protokol:
#   1. Tüm WLED transition ≥ 3000ms (ani değişim YOK)
#   2. Strobe/Flash efektleri YASAK (sadece Solid/Breathe)
#   3. Mavi ışık KAPALI (sadece kehribar/yeşil spektrum)
#   4. Maks parlaklık 150/255 (%58) — fotofobi koruması
#   5. MagicMirror kontrast düşük, koyu gri arka plan, kehribar yazı
#
# "Bir doktor titizliğiyle, görsel korteksi korur."
# =============================================================================

# -----------------------------------------------------------------------------
# INPUT BOOLEAN — VSS modu aktif
# -----------------------------------------------------------------------------
input_boolean:
  vss_lighting_mode:
    name: "VSS Lighting Mode"
    icon: mdi:eye-check
    initial: on

# -----------------------------------------------------------------------------
# OTOMASYONLAR
# -----------------------------------------------------------------------------
automation:
  # ===========================================================================
  # SENARYO 1: VSS Lighting Mode ON → Tüm ışıkları nöro-optik moda al
  # ===========================================================================
  - id: vss_lighting_activate
    alias: "VSS — Nöro-Optik Aydınlatma Aktif"
    description: >
      VSS modu açıldığında tüm WLED ve ışıkları nörolojik olarak güvenli
      moda alır: FL-41 Rose Tint spektrumu, transition 3000ms (ZORUNLU),
      mavi ışık KAPALI, maks parlaklık %58, efektler Solid/Breathe only.
      Ayrıca Pattern Glare kırma için Modül 3 (Space Projection) tavan
      projeksiyonunu düşük kontrastlı nebula modunda tetikler.

      🧠 VSS KORUMA — FL-41 + PATTERN GLARE:
      FL-41 Rose Tint (#E6A8D7) → 480-520nm kesim → fotofobi baskılanır.
      Pattern Glare kırma → düz beyaz tavan → nebula maskeleme.
      Ani ışık = palinopsia → transition 3000ms ZORUNLU.
      "Bir doktor titizliğiyle, görsel korteksi korur."

      🤖 PROAKTİF AI TETİKLEME:
      DeepSeek V4-Pro, kullanıcının akıllı saat HRV verisinden stres seviyesini
      analiz eder. HRV düşüşü → otonom sinir sistemi stres altında → VSS krizi
      yaklaşabilir → AI proaktif olarak VSS modunu tetikler. "Krizi beklemek
      yerine, krizi önler."

    trigger:
      - platform: state
        entity_id: input_boolean.vss_lighting_mode
        to: "on"
        id: vss_on

    action:
      # -------------------------------------------------------------------------
      # WLED → FL-41 Rose Tint, Solid, transition 3000ms, maks %58
      # -------------------------------------------------------------------------
      # 🧠 FL-41 ROSE TINT (#E6A8D7):
      # 480-520nm (mavi-yeşil) bandını filtreler → fotofobi baskılanır
      # Klinik olarak VSS semptomlarını %30-50 azaltır
      # Standart kehribar yerine FL-41 spektrumu kullanılır
      - service: light.turn_on
        target:
          entity_id: light.wled_ambient
        data:
          rgb_color: [230, 168, 215] # FL-41 Rose Tint (#E6A8D7) — VSS klinik
          brightness: 150 # %58 — fotofobi koruması
          effect: "Solid" # Sabit — strobe/flash YASAK
          transition: 3 # 3000ms ZORUNLU — palinopsia engelle

      # Yatak altı COB LED → FL-41 Rose Tint, düşük parlaklık
      - service: light.turn_on
        target:
          entity_id: light.underbed_cob_light
        data:
          brightness: 38 # %15 — gece için çok loş
          transition: 3 # 3000ms ZORUNLU

      # -------------------------------------------------------------------------
      # PATTERN GLARE KIRMA — Modül 3 (Space Projection) tavan nebula
      # -------------------------------------------------------------------------
      # 🧠 PATTERN GLARE:
      # Düz beyaz tavan → "empty field static" → karıncalanma artışı.
      # Çözüm: Tavan projeksiyonunu "çok yavaş dönen, koyu mor/kırmızı
      # düşük kontrastlı nebula" modunda tetikle → düz yüzeyi maskele.
      # "Düz yüzey = karıncalanma; hareketli düşük kontrast = sakin."
      - service: script.scene_romantic_nebula
      # Koyu mor/kırmızı nebula → düşük kontrast → Pattern Glare kırma

      # Motor hızını en yavaş (%10) → hipnotik yavaş hareket → görsel stres yok
      - service: select.select_option
        target:
          entity_id: select.galaxy_projector_speed
        data:
          option: "slow"

      # Parlaklığı minimum → fotofobi koruması
      - service: number.set_value
        target:
          entity_id: number.galaxy_projector_brightness
        data:
          value: 20 # %20 — çok loş

      # Yeşil lazer KAPAT (VSS tetikleyici)
      - service: switch.turn_off
        target:
          entity_id: switch.galaxy_projector_laser

      # Tavan ışıkları → sıcak amber (2700K), düşük parlaklık
      - service: light.turn_on
        target:
          entity_id:
            - light.ceiling_light
            - light.room_main_lights
        data:
          brightness_pct: 30
          color_temp: 370 # 2700K sıcak amber
          transition: 3

      # MagicMirror → VSS CSS modu aktif
      - service: mqtt.publish
        data:
          topic: "jarvis/mirror/vss_mode"
          payload: "ON"
          retain: true

      # Jarvis onay
      - service: tts.speak
        target:
          entity_id: tts.jarvis_voice
        data:
          message: "Nöro-optik aydınlatma modu aktif. Işıklar gözlerinizi korumak için ayarlandı."

  # ===========================================================================
  # SENARYO 2: VSS KORUMA — Ani ışık değişimini engelle
  # ===========================================================================
  - id: vss_prevent_flash
    alias: "VSS — Ani Işık Değişimi Engelle"
    description: >
      Başka bir modül (stadyum, parti, vb.) strobe/flash efekti tetiklerse,
      VSS modu aktifken bu efekt KESİNLİKLE engellenir.

      🧠 VSS KORUMA:
      Strobe/Flash = palinopsia tetikleyici. VSS modunda ASLA izin verilmez.
      "Bir doktor titizliğiyle, görsel korteksi korur."

    trigger:
      # WLED efekt değiştiğinde kontrol et
      - platform: state
        entity_id: light.wled_ambient
        id: wled_changed

    condition:
      - condition: state
        entity_id: input_boolean.vss_lighting_mode
        state: "on"

    action:
      # Efekt "Strobe" veya "Flash" ise → hemen "Solid" yap
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {{ state_attr('light.wled_ambient', 'effect') in ['Strobe', 'Flash', 'Rainbow', 'Chase'] }}
            sequence:
              - service: light.turn_on
                target:
                  entity_id: light.wled_ambient
                data:
                  effect: "Solid"
                  transition: 3
              - service: tts.speak
                target:
                  entity_id: tts.jarvis_voice
                data:
                  message: "Uyarı: Flaş efekti VSS modu nedeniyle engellendi."

