# barista_mode - Espresso / Kahve Makinesi Otomasyonu
# Akıllı priz destekli kahve hazırlık akışı

smart_plug:
  entity_id: "switch.coffee_machine_plug"
  warmup_sec: 90

schedule:
  morning_coffee: "07:25"
  weekend_coffee: "08:55"

notifications:
  ready_message: "Kahveniz hazır ☕"
  notify_service: "notify.mobile_app"
