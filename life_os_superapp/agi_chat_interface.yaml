# =============================================================================
# life_os_superapp — AGI Chat Interface (Jarvis ile Mesajlaşma)
# =============================================================================
# Dashboard'un sağ alt köşesinde sürekli duran (Floating button) bir "Chat"
# arayüzü entegrasyonu. Kullanıcı bu chat ekranından 2026 AGI modeline
# (MiniMax Speech 2.8 Turbo / DeepSeek V4-Pro) yazılı komutlar verebilir, fotoğraf atabilir.
#
# 🎨 UX (Kullanıcı Deneyimi) MANTIK:
# =============================================================================
# Chat arayüzü "gizli" değil — sağ alt köşede sürekli görünür (floating).
# Kullanıcı her an Jarvis'e yazabilir:
#   - "Bize cyberpunk ortamı yap" → AGI HA API → oda değişir
#   - "Bugün kaç kalori aldım?" → Modül 16 sağlık verisi
#   - (Fotoğraf atar) "Bunu kalori takibime ekle" → Vision API
#
# Bu, "kontrol paneli" → "yaşam yoldaşı" dönüşümüdür.
# Kullanıcı buton aramaz — sohbet eder.
# =============================================================================

# -----------------------------------------------------------------------------
# INPUT BOOLEAN — Chat arayüzü aktif
# -----------------------------------------------------------------------------
input_boolean:
  agi_chat_active:
    name: "AGI Chat Active"
    icon: mdi:chat-outline
    initial: on

# -----------------------------------------------------------------------------
# SCRIPT: AGI Chat'e Mesaj Gönder
# -----------------------------------------------------------------------------
# Bu script, kullanıcının chat'ten yazdığı mesajı alır ve
# hybrid_brain_and_memory_manager.py'ye (DeepSeek V4-Pro) gönderir.
#
# 🤖 AGENTIC MANTIK:
# Kullanıcı "Bize cyberpunk ortamı yap" yazar →
# 1. Mesaj MQTT'ye publish: jarvis/agi/chat_input
# 2. hybrid_brain_and_memory_manager.py dinler → DeepSeek V4-Pro → en uygun cevap
# 3. DeepSeek V4-Pro: "cyberpunk" → HA_ACTION JSON ÜRETİR
# 4. agentic_home_assistant_api.py → HA REST API → oda değişir
# 5. Cevap MQTT'ye: jarvis/agi/chat_output → chat'te göster
# -----------------------------------------------------------------------------
script:
  agi_chat_send:
    alias: "AGI Chat — Mesaj Gönder"
    icon: mdi:send
    description: >
      Kullanıcının chat mesajını AGI orchestrator'a gönderir.
      MiniMax Speech 2.8 Turbo / DeepSeek V4-Pro yanıtlar ve gerekirse HA aksiyonu alır.
    fields:
      message:
        description: "Kullanıcının mesajı"
        example: "Bize cyberpunk ortamı yap"
        required: true
      image:
        description: "Fotoğraf (base64, opsiyonel — Vision API için)"
        example: ""
        required: false
    sequence:
      # -------------------------------------------------------------------------
      # Adım 1: Mesajı MQTT'ye gönder → hybrid_brain_and_memory_manager.py dinler
      # -------------------------------------------------------------------------
      - service: mqtt.publish
        data:
          topic: "jarvis/agi/chat_input"
          payload: >
            {
              "message": "{{ message }}",
              "image": "{{ image | default('') }}",
              "timestamp": "{{ now().isoformat() }}",
              "context": {
                "active_modules": [
                  {% if is_state('input_boolean.intimacy_sync_active', 'on') %}"intimacy"{% endif %},
                  {% if is_state('input_boolean.barista_mode_active', 'on') %}"barista"{% endif %},
                  {% if is_state('input_boolean.movie_mode_active', 'on') %}"movie"{% endif %},
                  {% if is_state('input_boolean.stadium_mode_active', 'on') %}"stadium"{% endif %}
                ],
                "emotion": "{{ states('input_select.jarvis_user_emotion') }}",
                "activity_level": {{ states('sensor.bed_activity_level') | float(0) }}
              }
            }

      # -------------------------------------------------------------------------
      # Adım 2: Orchestrator cevabını bekle (MQTT dinleyici ayrı otomasyonda)
      # -------------------------------------------------------------------------
      # hybrid_brain_and_memory_manager.py, cevabı jarvis/agi/chat_output'a publish eder.
      # Aşağıdaki otomasyon (agi_chat_receive) bu cevabı yakalar ve gösterir.

# -----------------------------------------------------------------------------
# OTOMASYON: AGI Chat Cevabı Al → Göster
# -----------------------------------------------------------------------------
automation:
  - id: agi_chat_receive
    alias: "AGI Chat — Cevap Al ve Göster"
    description: >
      hybrid_brain_and_memory_manager.py'nin cevabını MQTT'den alır ve
      chat arayüzünde gösterir. Eğer cevap HA_ACTION içeriyorsa,
      agentic_home_assistant_api.py zaten çalıştırmıştır.

      🤖 AGENTIC AKIŞ:
      Kullanıcı yazılı komut → MiniMax Speech 2.8 Turbo/DeepSeek V4-Pro → cevap + HA_ACTION
      → HA REST API → oda değişir → cevap chat'te görünür

    trigger:
      - platform: mqtt
        topic: "jarvis/agi/chat_output"
        id: agi_response

    condition:
      - condition: state
        entity_id: input_boolean.agi_chat_active
        state: "on"

    action:
      # -------------------------------------------------------------------------
      # Cevabı al ve chat'te göster
      # -------------------------------------------------------------------------
      # MQTT payload: {"text": "Cyberpunk modu aktif, efendim.", "action_taken": true}
      - variables:
          response_text: "{{ trigger.payload_json.text | default('Anlaşıldı, efendim.') }}"
          action_taken: "{{ trigger.payload_json.action_taken | default(false) }}"

      # Eğer HA aksiyonu alındıysa, kısa bildirim
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ action_taken }}"
            sequence:
              # Chat'te cevap göster (browser_mod notification)
              - service: mqtt.publish
                data:
                  topic: "jarvis/agi/chat_display"
                  payload: >
                    {"role": "jarvis", "text": "{{ response_text }}", "timestamp": "{{ now().isoformat() }}"}
        default:
          # Sadece metin cevabı (HA aksiyonu yok)
          - service: mqtt.publish
            data:
              topic: "jarvis/agi/chat_display"
              payload: >
                {"role": "jarvis", "text": "{{ response_text }}", "timestamp": "{{ now().isoformat() }}"}

  # ===========================================================================
  # FOTOĞRAF → VISION API → "Bunu kalori takibime ekle"
  # ===========================================================================
  - id: agi_chat_photo_vision
    alias: "AGI Chat — Fotoğraf Analizi (Vision API)"
    description: >
      Kullanıcı chat'e fotoğraf atar ve "Bunu kalori takibime ekle" der.
      Fotoğraf Qwen-VL Max'a gönderilir → yemek tanınır → kalori hesaplanır.

      🎨 UX: Kullanıcı fotoğraf seçer → "Bunu kalori takibime ekle" yazar
      → Qwen-VL Max yemeği tanır → "Domatesli makarna, 450 kcal" →
      günlük kaloriye eklenir → chat'te cevap görünür.

    trigger:
      - platform: mqtt
        topic: "jarvis/agi/chat_input"
        id: chat_with_image

    condition:
      # Fotoğraf var mı?
      - condition: template
        value_template: "{{ trigger.payload_json.image | length > 0 }}"

    action:
      # Fotoğrafı Qwen-VL Max'a gönder
      - service: mqtt.publish
        data:
          topic: "jarvis/vision/request"
          payload: >
            {
              "image": "{{ trigger.payload_json.image }}",
              "prompt": "{{ trigger.payload_json.message }}",
              "mode": "calorie_analysis",
              "timestamp": "{{ now().isoformat() }}"
            }

      # Vision API cevabını bekle (ayrı otomasyon dinler)
      # Qwen-VL Max: yemeği tanır → kalori + makro → cevap

