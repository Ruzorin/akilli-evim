# underbed_lighting - ESPHome Yapılandırması
#
# ⚠️ Bu dosya bir stub'tır. Gerçek ESPHome konfigürasyonu:
#   → ld2410_bed_radar_esphome.yaml
#
# ld2410_bed_radar_esphome.yaml dosyası şunları içerir:
#   - LD2410B mmWave radar sensörü (UART 256000 baud)
#   - Gate 0-2 filtreleme (sadece ayak varlığı algılama)
#   - COB LED PWM kontrolü (GPIO25 → MOSFET → 12V COB LED)
#   - light.underbed_cob_light entity (HA otomasyonları için)
#   - Binary sensor: ayak yere değdi / değmedi
#
# ESP32 pin kullanımı:
#   GPIO 16 → LD2410 TX (RX2)
#   GPIO 17 → LD2410 RX (TX2)
#   GPIO 25 → COB LED PWM (MOSFET Gate)
#   GPIO 2  → Status LED
#
# Home Assistant entegrasyonu:
#   MQTT discovery ile otomatik keşif
#   night_routing_automations.yaml → gece tuvalete gidiş otomasyonu
